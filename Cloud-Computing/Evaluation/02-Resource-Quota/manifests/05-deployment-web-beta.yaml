# Second application, in its own namespace with its own (smaller) quota.
# Expected: ACCEPTED (2 replicas) and fills team-beta's pod quota.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-beta
  namespace: team-beta
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-beta
  template:
    metadata:
      labels:
        app: web-beta
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
