# TEST 2 - explicit requests/limits that fit inside the quota.
# Expected: ACCEPTED (2 replicas).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-alpha
  namespace: team-alpha
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-alpha
  template:
    metadata:
      labels:
        app: web-alpha
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
